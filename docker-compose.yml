version: '3.8'

services:
  nawamart-backend:
    build:
      context: ./nawamart-backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - RATE_LIMIT_MAX=600
    restart: always

  nawamart-frontend:
    build:
      context: ./nawamart-frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: always
